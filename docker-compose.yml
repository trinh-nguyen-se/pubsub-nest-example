services:
  postgres:
    image: postgres:16-alpine
    container_name: pubsub-postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: cms
    ports:
      - '45432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d cms']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pubsub-redis
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '46379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
